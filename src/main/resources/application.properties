# Sem JPA/Hibernate: o acesso ao banco e feito manualmente com JdbcTemplate.
# Isso forca a gente a escrever os mapeamentos (RowMapper) e deixa visivel
# por que DTO + Mapper existem: a Entity nunca "e" o JSON que entra ou sai da API.

